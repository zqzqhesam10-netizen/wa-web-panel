<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Netflix Clone</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
}

.container{
    padding:20px;
}

.card{
    width:220px;
    background:#222;
    display:inline-block;
    margin:10px;
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.info{
    padding:10px;
}

</style>

</head>

<body>

<h1>🎬 Netflix Clone</h1>

<div class="container">

{% for i in items %}

<div class="card">

<img src="{{ i['image'] }}">

<div class="info">

<h3>{{ i['title'] }}</h3>

<p>{{ i['category'] }}</p>

</div>

</div>

{% endfor %}

</div>

</body>
</html>

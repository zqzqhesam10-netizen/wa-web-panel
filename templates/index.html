<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Panel</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 30%;
            background: #075E54;
            color: white;
            overflow-y: auto;
        }

        .chat {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #128C7E;
            padding: 10px;
            color: white;
        }

        .messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #ECE5DD;
        }

        .input {
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: #128C7E;
            color: white;
            border: none;
        }

        .contact {
            padding: 10px;
            border-bottom: 1px solid #0a7a66;
            cursor: pointer;
        }

        .msg {
            background: white;
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="sidebar" id="contacts">
    <h3 style="padding:10px;">Contacts</h3>
</div>

<div class="chat">
    <div class="header" id="chatHeader">Chat</div>

    <div class="messages" id="messages"></div>

    <div class="input">
        <input id="msg" placeholder="Type message">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
let current = "";

async function loadContacts(){
    let res = await fetch('/messages');
    let data = await res.json();

    let contacts = document.getElementById("contacts");
    contacts.innerHTML = "<h3 style='padding:10px;'>Contacts</h3>";

    let unique = [...new Set(data.map(x => x[0]))];

    unique.forEach(p=>{
        let div = document.createElement("div");
        div.className = "contact";
        div.innerText = p;
        div.onclick = ()=>loadChat(p);
        contacts.appendChild(div);
    });
}

async function loadChat(phone){
    current = phone;
    document.getElementById("chatHeader").innerText = phone;

    let res = await fetch('/messages');
    let data = await res.json();

    let box = document.getElementById("messages");
    box.innerHTML = "";

    data.forEach(m=>{
        if(m[0] == phone){
            let div = document.createElement("div");
            div.className = "msg";
            div.innerText = m[1];
            box.appendChild(div);
        }
    });
}

async function send(){
    let msg = document.getElementById("msg").value;

    await fetch('/send',{
        method:"POST",
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({phone:current,message:msg})
    });

    loadChat(current);
}

setInterval(loadContacts,3000);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WhatsApp Pro Panel</title>

<style>
body{margin:0;font-family:Arial;display:flex;height:100vh;background:#0a1014;}

.sidebar{width:28%;background:#111b21;color:white;overflow-y:auto;}
.chat{width:72%;display:flex;flex-direction:column;}

.contact{padding:14px;border-bottom:1px solid #2a3942;cursor:pointer;}
.contact:hover{background:#1f2c33;}

.header{padding:15px;background:#202c33;color:white;font-weight:bold;}

.messages{flex:1;overflow-y:auto;padding:15px;background:#0a1014;}

.msg{
max-width:60%;
padding:10px;
margin:6px;
border-radius:10px;
color:white;
}

.in{background:#202c33;}
.out{background:#005c4b;margin-left:auto;}

.input{display:flex;background:#202c33;}
input{flex:1;padding:12px;border:none;outline:none;background:#2a3942;color:white;}
button{padding:12px;background:#00a884;border:none;color:white;cursor:pointer;}

.top{display:flex;padding:10px;background:#111b21;}
.top input{padding:10px;width:100%;}
</style>
</head>

<body>

<div class="sidebar" id="contacts">
<div style="padding:15px;font-weight:bold;">Chats</div>
</div>

<div class="chat">

<div class="header" id="header">Select Chat</div>

<div class="top">
<input id="manual" placeholder="Enter phone number">
</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="msg" placeholder="Message...">
<button onclick="send()">Send</button>
</div>

</div>

<script>

let current="";

async function load(){
let res=await fetch('/messages');
let data=await res.json();

let contacts=document.getElementById("contacts");
contacts.innerHTML="<div style='padding:15px;font-weight:bold;'>Chats</div>";

let unique=[...new Set(data.map(x=>x.phone))];

unique.forEach(p=>{
let div=document.createElement("div");
div.className="contact";
div.innerText="📱 "+p;
div.onclick=()=>openChat(p);
contacts.appendChild(div);
});

if(unique.length && !current){
openChat(unique[0]);
}
}

async function openChat(phone){
current=phone;
document.getElementById("header").innerText=phone;

let res=await fetch('/messages');
let data=await res.json();

let box=document.getElementById("messages");
box.innerHTML="";

data.filter(m=>m.phone==phone).forEach(m=>{
let div=document.createElement("div");
div.className="msg "+m.direction;
div.innerText=m.message;
box.appendChild(div);
});

box.scrollTop=box.scrollHeight;
}

async function send(){

let phone=document.getElementById("manual").value || current;
let msg=document.getElementById("msg").value;

if(!phone||!msg)return;

await fetch('/send',{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({phone,message:msg})
});

document.getElementById("msg").value="";
openChat(phone);
}

setInterval(load,2000);
load();

</script>

</body>
</html>

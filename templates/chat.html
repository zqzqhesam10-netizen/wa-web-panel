<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>WhatsApp Web</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b141a;
    color:white;
}

.sidebar{
    width:30%;
    height:100vh;
    float:left;
    background:#111b21;
}

.chat{
    width:70%;
    height:100vh;
    float:left;
    display:flex;
    flex-direction:column;
}

.user{
    padding:15px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.user:hover{
    background:#202c33;
}

.messages{
    flex:1;
    padding:15px;
    overflow:auto;
}

.msg{
    background:#005c4b;
    padding:10px;
    margin:10px;
    border-radius:10px;
    width:max-content;
    max-width:60%;
}

.bottom{
    display:flex;
    padding:10px;
    background:#111b21;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:10px;
}

button{
    margin-left:10px;
    padding:10px;
    border:none;
    background:#00a884;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<!-- USERS -->
<div class="sidebar">

<h3 style="padding:10px">Chats</h3>

{% for u in users %}

<div class="user" onclick="openChat('{{ u['phone'] }}')">
    {{ u['phone'] }}
</div>

{% endfor %}

</div>

<!-- CHAT -->
<div class="chat">

<div class="messages" id="messages"></div>

<div class="bottom">

<input id="phone" placeholder="رقم الهاتف">
<input id="message" placeholder="اكتب رسالة">

<button onclick="sendMsg()">إرسال</button>

</div>

</div>

<script>

let currentUser = "";

function openChat(phone){
    currentUser = phone;
    document.getElementById("phone").value = phone;
    loadMessages();
}

function loadMessages(){

    if(!currentUser) return;

    fetch("/messages/" + currentUser)
    .then(r => r.json())
    .then(data => {

        let box = document.getElementById("messages");
        box.innerHTML = "";

        data.messages.forEach(m => {
            box.innerHTML += `<div class="msg">${m.message}</div>`;
        });

    });
}

function sendMsg(){

    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;

    fetch("/send", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `phone=${phone}&message=${message}`
    })
    .then(() => {

        // تحديث مباشر للشات
        loadMessages();

        // مسح الرسالة فقط
        document.getElementById("message").value = "";

    });

}

// تحديث تلقائي
setInterval(loadMessages, 2000);

</script>

</body>
</html>

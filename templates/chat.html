<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>WhatsApp Panel</title>

<style>

body{
    margin:0;
    background:#0b141a;
    color:white;
    font-family:Arial;
}

.sidebar{
    width:30%;
    height:100vh;
    background:#111b21;
    float:left;
    overflow:auto;
}

.chat{
    width:70%;
    height:100vh;
    float:left;
    background:#222e35;
}

.user{
    padding:15px;
    border-bottom:1px solid #222;
}

.user:hover{
    background:#202c33;
}

.messages{
    height:85vh;
    padding:20px;
    overflow:auto;
}

.msg{
    background:#005c4b;
    padding:10px;
    border-radius:10px;
    margin:10px;
    width:max-content;
    max-width:60%;
}

.bottom{
    padding:10px;
    background:#111b21;
}

input{
    width:80%;
    padding:10px;
    border:none;
    border-radius:10px;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    background:#00a884;
    color:white;
}

</style>

</head>

<body>

<!-- USERS -->

<div class="sidebar">

<h2 style="padding:15px">Chats</h2>

{% for u in users %}

<div class="user">

{{ u['phone'] }}

</div>

{% endfor %}

</div>

<!-- CHAT -->

<div class="chat">

<div class="messages">

<div class="msg">
مرحباً 👋
</div>

</div>

<div class="bottom">

<form action="/send" method="POST">

<input name="phone" placeholder="رقم الهاتف">

<input name="message" placeholder="اكتب رسالة">

<button type="submit">
إرسال
</button>

</form>

</div>

</div>

</body>
</html>

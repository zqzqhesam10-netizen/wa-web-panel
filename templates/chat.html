<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: #dadbd3; overflow: hidden; }
        
        .sidebar { width: 380px; min-width: 380px; background: #fff; display: flex; flex-direction: column; border-left: 1px solid #e9edef; }
        .sidebar-header { height: 60px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        /* لوحة المراقبة */
        .monitor-panel { background: #f8f9fa; padding: 10px; border-bottom: 1px solid #e9edef; font-size: 12px; }
        .site-item { display: flex; justify-content: space-between; padding: 2px 0; }
        
        .user-list { flex: 1; overflow-y: auto; background: #fff; }
        .user-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f2f5; }
        .user-item:hover { background: #f5f6f6; }
        .user-item.active { background: #eaebeb; }
        
        /* (باقي التنسيقات كما هي في كودك...) */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; background: #fff; }
        .msg-row.me .bubble { background: #d9fdd3; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 24px; border-radius: 8px; width: 380px; }
    </style>
</head>
<body>

    <div class="modal" id="newChatModal">...</div>
    <div class="modal" id="broadcastModal">...</div>

    <div class="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: bold;">المحادثات</span>
            <div class="header-actions">
                <button onclick="openBroadcastModal()">📢</button>
                <button onclick="openNewChatModal()">➕</button>
            </div>
        </div>

        <div class="monitor-panel">
            <h5 style="margin-bottom: 5px;">📡 حالة المواقع:</h5>
            <div id="sites-status-list">جاري فحص الاتصال...</div>
        </div>
        
        <div class="user-list"></div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
        </div>

    <script>
        // دمج دوال الشات
        // ... (كل دوال الـ JS الخاصة بك) ...

        // دالة مراقبة المواقع المدمجة
        function refreshMonitor() {
            fetch('/api/monitor-status')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('sites-status-list');
                    list.innerHTML = data.map(site => `
                        <div class="site-item">
                            <span>${site.name}</span>
                            <span style="color: ${site.status === 'OK' ? 'green' : 'red'}">${site.status}</span>
                        </div>
                    `).join('');
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchUsersList();
            refreshMonitor(); // تحديث فوري
            setInterval(fetchUsersList, 4000);
            setInterval(refreshMonitor, 60000); // تحديث المراقبة كل دقيقة
        });
    </script>
</body>
</html>

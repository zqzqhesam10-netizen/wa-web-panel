<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>واتساب ويب - لوحة التحكم</title>
    <style>
        /* CSS الخاص بك كامل */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; background-color: #dadbd3; }
        .sidebar { width: 380px; background: #fff; display: flex; flex-direction: column; border-left: 1px solid #ddd; }
        .monitor-panel { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #e9edef; font-size: 12px; }
        .site-item { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .header-actions { display: flex; gap: 5px; }
        button { cursor: pointer; padding: 5px 10px; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; }
        .bubble { padding: 8px 12px; border-radius: 8px; background: #fff; max-width: 60%; margin-bottom: 5px; }
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header" style="padding:15px; background:#f0f2f5;">
        <span>المحادثات</span>
        <div class="header-actions">
            <button onclick="document.getElementById('broadcastModal').style.display='flex'">📢</button>
            <button onclick="document.getElementById('newChatModal').style.display='flex'">➕</button>
        </div>
    </div>
    <div class="monitor-panel">
        <h4>📡 حالة المواقع</h4>
        <div id="sites-status-list">جاري الفحص...</div>
    </div>
    <div class="user-list"></div>
</div>

<div class="chat-area" id="chatArea" style="display: none;">
    <div id="currentChatUser" style="padding:15px; background:#f0f2f5;"></div>
    <div class="messages-container" id="messagesContainer"></div>
    <form onsubmit="sendMessage(event)" style="padding:10px;">
        <input type="hidden" id="activePhone">
        <input type="text" id="messageInput" required style="width:85%; padding:10px;">
        <button type="submit">إرسال</button>
    </form>
</div>

<div class="modal" id="broadcastModal"><div style="background:white; padding:20px;"><h3>بث للكل</h3><textarea id="bMsg"></textarea><button onclick="sendBroadcast()">إرسال</button><button onclick="this.parentElement.parentElement.style.display='none'">إغلاق</button></div></div>
<div class="modal" id="newChatModal"><div style="background:white; padding:20px;"><h3>رقم جديد</h3><input id="newPhone"><button onclick="createNewChat()">إضافة</button></div></div>

<script>
    let currentPhone = "";
    
    function fetchUsersList() {
        fetch('/api/users').then(res => res.json()).then(data => {
            const list = document.querySelector('.user-list');
            list.innerHTML = data.map(u => `<div class="user-item" onclick="openChat('${u.phone}')">${u.phone}</div>`).join('');
        });
    }

    function refreshMonitor() {
        fetch('/api/monitor-status').then(res => res.json()).then(data => {
            document.getElementById('sites-status-list').innerHTML = data.map(s => 
                `<div class="site-item"><span>${s.name}</span><b style="color:${s.status=='OK'?'green':'red'}">${s.status}</b></div>`
            ).join('');
        });
    }

    function openChat(phone) {
        currentPhone = phone;
        document.getElementById('activePhone').value = phone;
        document.getElementById('currentChatUser').innerText = phone;
        document.getElementById('chatArea').style.display = 'flex';
        fetchMessages();
    }

    function fetchMessages() {
        fetch(`/api/messages/${currentPhone}`).then(res => res.json()).then(data => {
            document.getElementById('messagesContainer').innerHTML = data.messages.map(m => 
                `<div class="bubble">${m.message}</div>`).join('');
        });
    }

    function sendMessage(e) {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        const fd = new FormData(); fd.append('phone', currentPhone); fd.append('message', msg);
        fetch('/send', { method: 'POST', body: fd }).then(() => { document.getElementById('messageInput').value=''; fetchMessages(); });
    }

    function sendBroadcast() {
        const msg = document.getElementById('bMsg').value;
        const fd = new FormData(); fd.append('message', msg);
        fetch('/api/broadcast', { method: 'POST', body: fd }).then(() => alert("تم الإرسال!"));
    }

    function createNewChat() {
        const ph = document.getElementById('newPhone').value;
        const fd = new FormData(); fd.append('phone', ph);
        fetch('/api/add_user', { method: 'POST', body: fd }).then(() => { fetchUsersList(); document.getElementById('newChatModal').style.display='none'; });
    }

    // التشغيل
    setInterval(fetchUsersList, 5000);
    setInterval(refreshMonitor, 30000);
    fetchUsersList(); refreshMonitor();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; background-color: #dadbd3; }
        .sidebar { width: 380px; background: #fff; display: flex; flex-direction: column; border-left: 1px solid #e9edef; }
        .sidebar-header { height: 60px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
        .header-actions { display: flex; gap: 8px; }
        .text-btn { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 13px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px; border-radius: 8px; max-width: 65%; font-size: 14px; }
        .me { background: #d9fdd3; align-self: flex-end; }
        .them { background: #ffffff; align-self: flex-start; }
        .input-area { height: 62px; background: #f0f2f5; display: flex; padding: 5px; align-items: center; }
        .user-item { padding: 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>المحادثات</span>
            <div class="header-actions">
                <button class="text-btn" style="background-color: #667781;" onclick="checkStatus()">🟢 الحالة</button>
                <button class="text-btn" style="background-color: #0284c7;" onclick="alert('ميزة البث')">📢</button>
                <button class="text-btn" style="background-color: #00a884;" onclick="alert('ميزة الإضافة')">➕</button>
            </div>
        </div>
        <div class="user-list" id="userList"></div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
        <div id="currentChatUser" style="padding: 15px; background: #f0f2f5; font-weight: bold;"></div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <input type="hidden" id="activePhone">
            <input type="text" id="messageInput" style="flex:1; padding:10px; border-radius:8px; border:none;" placeholder="اكتب رسالة...">
            <button onclick="sendMessage()" style="padding:10px 20px; background:#00a884; color:white; border:none; border-radius:8px; margin-right:5px;">إرسال</button>
        </div>
    </div>

    <script>
        // دالة الحالة
        function checkStatus() {
            fetch('/api/status').then(r => r.json()).then(d => alert(d.message)).catch(() => alert("خطأ في الاتصال"));
        }

        // جلب المستخدمين
        fetch('/api/users').then(r => r.json()).then(data => {
            const list = document.getElementById('userList');
            list.innerHTML = data.users.map(u => `<div class="user-item" onclick="openChat('${u.phone}')">${u.phone}</div>`).join('');
        });

        // فتح محادثة
        function openChat(phone) {
            document.getElementById('activePhone').value = phone;
            document.getElementById('currentChatUser').innerText = phone;
            document.getElementById('chatArea').style.display = 'flex';
            fetchMessages(phone);
        }

        // جلب الرسائل
        function fetchMessages(phone) {
            fetch(`/api/messages/${phone}`)
            .then(r => r.json())
            .then(data => {
                const cont = document.getElementById('messagesContainer');
                cont.innerHTML = data.messages.map(m => `
                    <div class="bubble ${m.sender === 'me' ? 'me' : 'them'}">
                        ${m.message} <small>(${m.msg_time})</small>
                    </div>`).join('');
                cont.scrollTop = cont.scrollHeight;
            });
        }

        // إرسال رسالة
        function sendMessage() {
            const phone = document.getElementById('activePhone').value;
            const msg = document.getElementById('messageInput').value;
            const formData = new FormData();
            formData.append('phone', phone);
            formData.append('message', msg);
            fetch('/send', { method: 'POST', body: formData }).then(() => {
                document.getElementById('messageInput').value = '';
                fetchMessages(phone);
            });
        }
    </script>
</body>
</html>

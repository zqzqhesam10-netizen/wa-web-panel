<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب - لوحة التحكم</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #dadbd3; }
        
        .sidebar { width: 350px; background: #fff; display: flex; flex-direction: column; border-left: 1px solid #e9edef; }
        .sidebar-header { height: 60px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
        .avatar { width: 40px; height: 40px; background: #dfe5e7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #54656f; font-size: 20px; }
        .search-box { padding: 8px 12px; background: #fff; border-bottom: 1px solid #f0f2f5; }
        .search-inner { background: #f0f2f5; border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 10px; color: #667781; }
        .search-inner input { background: transparent; border: none; outline: none; width: 100%; font-size: 14px; }
        
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f0f2f5; transition: 0.2s; }
        .user-item:hover { background: #f0f2f5; }
        .user-item.active { background: #eaebeb; }
        .user-info { margin-right: 15px; flex: 1; }
        .user-name { font-weight: 500; color: #111b21; font-size: 16px; }
        .user-status { font-size: 13px; color: #667781; margin-top: 2px; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-repeat: repeat; }
        .chat-header { height: 60px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e9edef; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 5%; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.me { justify-content: flex-start; } 
        .msg-row.them { justify-content: flex-end; }
        
        .bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); word-wrap: break-word; display: flex; flex-direction: column; }
        .msg-row.me .bubble { background: #d9fdd3; color: #111b21; border-top-right-radius: 0; }
        .msg-row.them .bubble { background: #ffffff; color: #111b21; border-top-left-radius: 0; }

        /* تنسيق الأيقونات الخاصة بحالة الاستلام والقراءة */
        .status-container { align-self: flex-end; margin-top: 4px; font-size: 11px; color: #8696a0; display: flex; align-items: center; gap: 3px; }
        .status-container .fa-check-double { color: #8696a0; }
        .status-container .fa-check-double.read { color: #53bdeb; } /* اللون الأزرق عند القراءة */

        .input-area { height: 62px; background: #f0f2f5; display: flex; align-items: center; padding: 5px 15px; gap: 10px; }
        .input-area form { display: flex; width: 100%; gap: 10px; align-items: center; }
        .input-box { flex: 1; background: #fff; border-radius: 8px; padding: 10px 15px; border: none; outline: none; font-size: 15px; }
        .btn-send { background: transparent; border: none; color: #54656f; font-size: 22px; cursor: pointer; transition: 0.2s; padding: 0 5px; }
        .btn-send:hover { color: #00a884; }

        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; background: #f8f9fa; color: #667781; text-align: center; border-bottom: 6px solid #00a884; }
        .welcome-screen i { font-size: 80px; color: #ced5d8; margin-bottom: 20px; }
        .welcome-screen h2 { color: #41525d; font-weight: 300; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <span style="font-weight: bold; color: #41525d;">محادثات الواتساب</span>
            <div style="color: #54656f; gap: 15px; display: flex; font-size: 18px;"><i class="fas fa-circle-notch"></i><i class="fas fa-comment-alt"></i></div>
        </div>
        <div class="search-box">
            <div class="search-inner">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="البحث أو بدء دردشة جديدة">
            </div>
        </div>
        
        <div class="user-list">
            {% for user in users %}
            <div class="user-item {% if user.phone == currentPhone %}active{% endif %}" data-phone="{{ user.phone }}" onclick="openChat('{{ user.phone }}', this)">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <div class="user-info">
                    <div class="user-name">{{ user.phone }}</div>
                    <div class="user-status">اضغط لعرض الرسائل...</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="chat-area" id="chatArea" style="display: none;">
        <div class="chat-header">
            <div class="avatar" style="margin-left: 15px;"><i class="fas fa-user"></i></div>
            <div>
                <div class="user-name" id="currentChatUser">جاري التحميل...</div>
                <div style="font-size: 12px; color: #667781;">متصل الآن</div>
            </div>
        </div>
        
        <div class="messages-container" id="messagesContainer">
            </div>

        <div class="input-area">
            <form id="sendForm" onsubmit="sendMessage(event)">
                <input type="hidden" id="activePhone">
                <input type="text" id="messageInput" class="input-box" placeholder="اكتب رسالتك هنا..." autocomplete="off" required>
                <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <div class="welcome-screen" id="welcomeScreen">
        <i class="fab fa-whatsapp"></i>
        <h2>واتساب ويب للمسؤول</h2>
        <p>الآن تظهر علامات الصح (إرسال/استلام/قراءة) للرسائل الصادرة تلقائياً.</p>
    </div>

    <script>
        let currentPhone = "";
        let chatIntervalId = null;
        let usersIntervalId = null;

        document.addEventListener("DOMContentLoaded", () => {
            fetchUsersList();
            usersIntervalId = setInterval(fetchUsersList, 5000);
        });

        function fetchUsersList() {
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    const userListContainer = document.querySelector('.user-list');
                    let htmlContent = "";
                    data.users.forEach(user => {
                        const isActive = user.phone === currentPhone ? 'active' : '';
                        htmlContent += `
                            <div class="user-item ${isActive}" data-phone="${user.phone}" onclick="openChat('${user.phone}', this)">
                                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                                <div class="user-info">
                                    <div class="user-name">${user.phone}</div>
                                    <div class="user-status">اضغط لعرض الرسائل...</div>
                                </div>
                            </div>
                        `;
                    });
                    userListContainer.innerHTML = htmlContent;
                });
        }

        function openChat(phone, element) {
            currentPhone = phone;
            document.getElementById('activePhone').value = phone;
            document.getElementById('currentChatUser').innerText = phone;
            
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatArea').style.display = 'flex';

            document.querySelectorAll('.user-item').forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');

            fetchMessages();

            if(chatIntervalId) clearInterval(chatIntervalId);
            chatIntervalId = setInterval(fetchMessages, 2000); // تحديث كل ثانيتين لجلب الحالات الجديدة فوراً
        }

        function fetchMessages() {
            if (!currentPhone) return;
            
            fetch(`/messages/${currentPhone}`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('messagesContainer');
                    const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
                    
                    container.innerHTML = "";
                    data.messages.forEach(msg => {
                        const row = document.createElement('div');
                        row.className = `msg-row ${msg.sender === 'me' ? 'me' : 'them'}`;
                        
                        // بناء شكل الـ Checkmarks بناءً على حالة الحقل في السيرفر
                        let statusHtml = "";
                        if(msg.sender === 'me') {
                            if(msg.status === 'sent') {
                                statusHtml = `<div class="status-container"><i class="fas fa-check"></i></div>`;
                            } else if(msg.status === 'delivered') {
                                statusHtml = `<div class="status-container"><i class="fas fa-check-double"></i></div>`;
                            } else if(msg.status === 'read') {
                                statusHtml = `<div class="status-container"><i class="fas fa-check-double read"></i></div>`;
                            }
                        }

                        row.innerHTML = `
                            <div class="bubble">
                                <span>${msg.message}</span>
                                ${statusHtml}
                            </div>
                        `;
                        container.appendChild(row);
                    });

                    if (isScrolledToBottom) {
                        container.scrollTop = container.scrollHeight;
                    }
                });
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('messageInput');
            const message = input.value;
            const phone = document.getElementById('activePhone').value;

            if(!message.trim()) return;

            const formData = new FormData();
            formData.append('phone', phone);
            formData.append('message', message);

            fetch('/send', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                input.value = ""; 
                fetchMessages();  
            });
        }
    </script>
</body>
</html>

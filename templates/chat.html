<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <style>
        /* تصميم بسيط وأنيق للمحادثة */
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        .msg { padding: 10px; margin: 5px 0; border-radius: 10px; }
        .me { background: #dcf8c6; text-align: left; }
        .them { background: #ececec; text-align: right; }
        #statusBtn { float: left; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <button id="statusBtn" onclick="checkStatus()">🟢 الحالة</button>
        <h2>المحادثات</h2>
        <div id="messagesContainer" style="height: 400px; overflow-y: scroll;"></div>
        
        <input type="text" id="phoneInput" placeholder="رقم الهاتف">
        <input type="text" id="msgInput" placeholder="الرسالة">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // زر الحالة
        function checkStatus() {
            fetch('/api/status').then(r => r.json()).then(d => alert(d.message));
        }

        // جلب الرسائل وتحديثها
        function fetchMessages() {
            const phone = document.getElementById('phoneInput').value;
            if(!phone) return;
            fetch(`/api/messages/${phone}`)
            .then(r => r.json())
            .then(data => {
                const cont = document.getElementById('messagesContainer');
                cont.innerHTML = data.messages.map(m => `
                    <div class="msg ${m.sender === 'me' ? 'me' : 'them'}">
                        ${m.message} <small>(${m.msg_time})</small>
                    </div>`).join('');
            });
        }

        // إرسال رسالة
        function sendMessage() {
            const phone = document.getElementById('phoneInput').value;
            const message = document.getElementById('msgInput').value;
            const formData = new FormData();
            formData.append('phone', phone);
            formData.append('message', message);
            
            fetch('/send', { method: 'POST', body: formData }).then(() => {
                document.getElementById('msgInput').value = '';
                fetchMessages();
            });
        }

        // تحديث تلقائي كل 5 ثوانٍ
        setInterval(fetchMessages, 5000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp Panel</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    height: 100vh;
}

#users {
    width: 30%;
    background: #111b21;
    color: white;
    overflow-y: auto;
}

.user {
    padding: 15px;
    border-bottom: 1px solid #222;
    cursor: pointer;
}

.user:hover {
    background: #202c33;
}

#chat {
    width: 70%;
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #e5ddd5;
}

.msg {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
    max-width: 60%;
}

.me {
    background: #d9fdd3;
    margin-left: auto;
}

.them {
    background: white;
}

#input {
    display: flex;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
}

button {
    padding: 10px;
    background: #00a884;
    color: white;
    border: none;
}
</style>

</head>

<body>

<div id="users"></div>

<div id="chat">
    <div id="messages"></div>

    <div id="input">
        <input id="msg" placeholder="اكتب رسالة...">
        <button onclick="send()">إرسال</button>
    </div>
</div>

<script>
let currentPhone = null;

async function loadUsers() {
    let res = await fetch("/api/users");
    let data = await res.json();

    let box = document.getElementById("users");
    box.innerHTML = "";

    data.forEach(u => {
        let div = document.createElement("div");
        div.className = "user";
        div.innerText = u.phone;

        div.onclick = () => {
            currentPhone = u.phone;
            loadMessages();
        };

        box.appendChild(div);
    });
}

async function loadMessages() {
    if (!currentPhone) return;

    let res = await fetch("/api/latest/" + currentPhone);
    let data = await res.json();

    let box = document.getElementById("messages");
    box.innerHTML = "";

    data.forEach(m => {
        let div = document.createElement("div");
        div.className = "msg " + m.sender;
        div.innerText = m.message;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

async function send() {
    let msg = document.getElementById("msg").value;

    await fetch("/send", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "phone=" + currentPhone + "&message=" + msg
    });

    document.getElementById("msg").value = "";
    loadMessages();
}

setInterval(() => {
    loadUsers();
    loadMessages();
}, 3000);

loadUsers();
</script>

</body>
</html>
